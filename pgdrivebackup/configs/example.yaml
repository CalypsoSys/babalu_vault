backup:
  temp_dir: "./tmp"
  root_dir: "./backups"
  log_path: "./logs/pgdrivebackup.log"
  gzip_level: 6
  dry_run: false
  time_of_day: "02:00"
  state_path: "./state/pgdrivebackup-scheduler.json"

retention:
  daily_keep: 4
  weekly_keep: 1
  monthly_keep: 1

servers:
  - name: "localdev"
    type: "tcp"
    host: "localhost"
    port: 5432
    username: "postgres"
    password: "${LOCALDEV_POSTGRES_PASSWORD}"
    databases:
      - name: "ommadb_dev"
      - name: "wordpress_dev"

  - name: "dockerdev"
    type: "docker"
    container: "dev-postgres"
    username: "postgres"
    password: "${LOCALDEV_POSTGRES_PASSWORD}"
    databases:
      - name: "app1_dev"
      - name: "app2_dev"
        retention:
          daily_keep: 4
          weekly_keep: 1
          monthly_keep: 1

  - name: "sshdocker"
    type: "ssh"
    ssh_target: "backup@example-host"
    ssh_remote_type: "docker"
    container: "ommadb-postgres"
    username: "postgres"
    password: "${REMOTE_POSTGRES_PASSWORD}"
    databases:
      - name: "mma_data_web"

  - name: "sshtcp"
    type: "ssh"
    ssh_target: "backup@db-host"
    ssh_port: 22
    ssh_remote_type: "tcp"
    host: "127.0.0.1"
    port: 5432
    username: "postgres"
    password: "${REMOTE_POSTGRES_PASSWORD}"
    databases:
      - name: "reporting"
