settings:
  temp_dir: "./tmp"
  root_dir: "./backups"
  log_path: "./logs/babalu-vault.log"
  gzip_level: 6
  dry_run: false
  time_of_day: "02:00"
  state_path: "./state/babalu-vault-scheduler.json"

retention:
  daily_keep: 4
  weekly_keep: 1
  monthly_keep: 1

servers:
  - name: "local-postgres-host"
    type: "tcp"
    host: "localhost"

  - name: "local-docker"
    type: "docker"

  - name: "homelab-wp-host"
    type: "ssh"
    ssh_target: "backup@homelab-wp-host"
    ssh_port: 22

backups:
  - name: "local-postgres"
    server: "local-postgres-host"
    engine: "postgres"
    source:
      mode: "tcp"
      port: 5432
      username: "postgres"
      password: "${LOCALDEV_POSTGRES_PASSWORD}"
    targets:
      - name: "ommadb-dev"
        database: "ommadb_dev"
      - name: "wordpress-dev"
        database: "wordpress_dev"

  - name: "local-docker-postgres"
    server: "local-docker"
    engine: "postgres"
    source:
      mode: "docker"
      container: "dev-postgres"
      username: "postgres"
      password: "${LOCALDEV_POSTGRES_PASSWORD}"
    targets:
      - name: "app1-dev"
        database: "app1_dev"
      - name: "app2-dev"
        database: "app2_dev"

  - name: "dndboomer-mysql"
    server: "homelab-wp-host"
    engine: "mysql"
    source:
      mode: "docker"
      container: "dndboomer_wp_db"
      username: "root"
      password_env: "MYSQL_ROOT_PASSWORD"
    targets:
      - name: "dndboomer-db"
        database: "wordpress"

  - name: "homelab-wp-files"
    server: "homelab-wp-host"
    engine: "files"
    targets:
      - name: "dndboomer-html"
        path: "/srv/stacks/wordpress/sites/dndboomer/html"
        excludes:
          - "wp-content/cache/**"
          - "wp-content/debug.log"
